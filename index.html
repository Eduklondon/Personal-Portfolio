<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<title>Login • Acesso Seguro</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="styles.css" />
</head>
<body>
	<main class="auth-layout">
		<section class="auth-hero">
			<div class="brand">
				<div class="logo" aria-hidden="true">ED</div>
				<h1 class="brand-title">Edu Platform</h1>
				<p class="brand-subtitle">Bem-vindo de volta! Acesse sua conta para continuar.</p>
			</div>
		</section>
		<section class="auth-card" aria-label="Formulário de login">
			<header class="card-header">
				<h2>Entrar</h2>
				<p>Acesse com seu e-mail e senha</p>
			</header>
			<form id="login-form" novalidate>
				<div class="form-group">
					<label for="email">E-mail</label>
					<div class="input-wrapper">
						<input type="email" id="email" name="email" autocomplete="username" placeholder="voce@exemplo.com" required />
					</div>
					<small class="input-hint" id="email-hint">Use um e-mail válido.</small>
				</div>

				<div class="form-group">
					<label for="password">Senha</label>
					<div class="input-wrapper password-wrapper">
						<input type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••" minlength="6" required />
						<button type="button" class="icon-button" id="toggle-password" aria-label="Mostrar senha" aria-pressed="false">
							<span class="icon-eye" aria-hidden="true"></span>
						</button>
					</div>
					<small class="input-hint" id="password-hint">Mínimo de 6 caracteres.</small>
				</div>

				<div class="form-row">
					<label class="checkbox">
						<input type="checkbox" id="remember" name="remember" />
						<span>Lembrar-me</span>
					</label>
					<a class="link" href="#" id="forgot-password">Esqueci minha senha</a>
				</div>

				<button type="submit" class="button button-primary" id="submit-btn">Entrar</button>

				<div class="divider" role="separator"><span>ou</span></div>

				<div class="oauth-grid">
					<button type="button" class="button button-neutral oauth-btn" data-provider="google">
						<img src="https://www.gstatic.com/images/branding/product/1x/googleg_24dp.png" alt="Google" width="18" height="18" />
						<span>Continuar com Google</span>
					</button>
					<button type="button" class="button button-neutral oauth-btn" data-provider="github">
						<img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/github/github-original.svg" alt="GitHub" width="18" height="18" />
						<span>Continuar com GitHub</span>
					</button>
				</div>

				<p class="muted signup-text">Não tem uma conta? <a class="link" href="#">Crie agora</a></p>
			</form>
		</section>
	</main>

	<footer class="app-footer">
		<p>© <span id="year"></span> Edu Platform. Todos os direitos reservados.</p>
	</footer>

	<script src="script.js"></script>
</body>
</html>
